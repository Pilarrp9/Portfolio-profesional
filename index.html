<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio profesional de Pilar Ramírez</title>
<meta name="description" content="Pilar Ramírez · Especialista e-Learning, administradora LMS y diseñadora instruccional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout: la estética del portfolio creativo (azul noche, crema, ámbar, paneles violeta redondeados, píldoras) con navegación de curso: portada → inicio con índice y tarjetas → páginas. */
:root{
  --navy:#14102b; --navy-deep:#0c0920;
  --cream:#f7ecda; --cream-2:rgba(247,236,218,.9); --muted:rgba(247,236,218,.62); --faint:rgba(247,236,218,.4);
  --amber:#e8a33d; --amber-soft:#f0c078; --rose:#c9714f; --sage:#8aab7c;
  --ink:#241c3d; --panel:#1d1740; --panel-2:#241c47; --panel-line:rgba(247,236,218,.14); --tint:rgba(247,236,218,.06);
  --k1:#7fb3e0; --k2:#e08fb0; --k3:#e8a33d; --k4:#7fd4c8; --k5:#8fbf9f;
  --s1:#f0b24a; --s2:#7fb3e0; --s3:#b9a2f0;
  --font:'Bricolage Grotesque',system-ui,-apple-system,"Segoe UI",sans-serif;
  --side:290px;
  color-scheme:dark;
}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:rgba(232,163,61,.35) rgba(247,236,218,.05)}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:rgba(247,236,218,.04);border-radius:99px}
*::-webkit-scrollbar-thumb{background:rgba(232,163,61,.35);border-radius:99px}
html,body{min-height:100%}
body{background:var(--navy-deep);background-image:radial-gradient(ellipse at 60% 0%,#241c47 0%,var(--navy-deep) 65%);background-attachment:fixed;color:var(--cream);font:15px/1.65 var(--font)}
h1,h2,h3,h4{font-family:var(--font);margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
a{color:var(--amber-soft)}
button,input,select,textarea{font-family:inherit;color:inherit}
strong{color:var(--amber-soft);font-weight:800}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
h1[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* botones del creativo */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;border-radius:999px;padding:13px 24px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;line-height:1.1;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--amber);color:var(--ink)}
.btn-primary:hover{background:var(--amber-soft)}
.btn-ghost{background:rgba(247,236,218,.08);border-color:rgba(247,236,218,.25);color:var(--cream)}
.btn-ghost:hover{background:rgba(232,163,61,.2);border-color:var(--amber)}
.btn-sm{padding:9px 16px;font-size:13.5px}
.li-btn{width:46px;height:46px;padding:0;border-radius:50%}
.li-btn:hover{background:rgba(10,102,194,.22);border-color:#0a66c2}
.li-btn.sm{width:38px;height:38px}
.sound{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:18px;z-index:70;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(247,236,218,.22);background:rgba(20,16,43,.72);backdrop-filter:blur(4px);font-size:18px;cursor:pointer;display:grid;place-items:center}
.sound:hover{border-color:var(--amber);background:rgba(232,163,61,.18)}
.sound.on{border-color:rgba(232,163,61,.4)}
body.in-app .sound{top:auto;bottom:calc(18px + env(safe-area-inset-bottom,0px))}

/* ================= PORTADA ================= */
.cover{position:relative;min-height:100vh;overflow:hidden;padding-bottom:48px}
.cover-bg{position:absolute;inset:0;background:url("img/house.jpg") center/cover no-repeat}
.cover-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,5,16,.96) 0%,rgba(6,5,16,.78) 38%,rgba(9,8,24,.45) 70%,rgba(9,8,24,.55) 100%)}
.cover-in{position:relative;z-index:1;width:100%;max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:72px 40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:center}
@media (max-width:760px){.cover-in{grid-template-columns:1fr;gap:24px;padding-block:72px 28px}.hero-portrait{order:-1}}
.hero-portrait{width:clamp(150px,22vw,260px);height:clamp(150px,22vw,260px);border-radius:50%;border:3px solid rgba(232,163,61,.5);box-shadow:0 18px 44px -16px rgba(232,163,61,.55)}
.landing{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:24px}
.cover-txt{display:grid;gap:14px}
.kicker{display:inline-flex;width:max-content;font-size:13px;font-weight:600;color:var(--amber-soft);background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.3);padding:5px 13px;border-radius:999px}
.cover h1{font-size:clamp(46px,7vw,84px);font-weight:700;letter-spacing:-.025em;line-height:.98}
.role{color:var(--amber-soft);font-size:clamp(17px,2vw,20px);font-weight:500;line-height:1.45}
.role span{display:block;font-size:.85em;opacity:.9}
.cover-cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.course-card{background:rgba(29,23,64,.88);backdrop-filter:blur(6px);border:1px solid var(--panel-line);border-radius:20px;overflow:hidden}
.cc-top{display:flex;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--panel-line)}
.cc-top img{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--amber));flex:none;box-shadow:0 10px 24px -8px rgba(232,163,61,.55)}
.cc-top b{font-size:17px;font-weight:700;display:block}
.cc-top span{font-size:13px;color:var(--muted)}
.cc-list{list-style:none;margin:0;padding:8px}
.cc-list button{width:100%;display:flex;gap:14px;align-items:center;padding:11px 12px;border:0;background:none;border-radius:14px;cursor:pointer;text-align:left;transition:background .15s}
.cc-list button:hover{background:rgba(232,163,61,.12)}
.cc-ic{width:40px;height:40px;border-radius:12px;background:var(--c);display:grid;place-items:center;font-size:20px;flex:none}
.cc-list .t{flex:1;min-width:0}
.cc-list .t b{display:block;font-size:15.5px;font-weight:700}
.cc-list .t span{font-size:12.5px;color:var(--muted)}
.cc-list .arr{color:var(--amber-soft);font-size:18px}
.cc-foot{padding:10px 20px 14px;border-top:1px solid var(--panel-line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}

/* ================= APP ================= */
.app{display:none}
body.in-app .app{display:block}
body.in-app .cover{display:none}
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side);background:rgba(20,16,43,.92);backdrop-filter:blur(6px);border-right:1px solid var(--panel-line);display:flex;flex-direction:column;z-index:50;padding-top:env(safe-area-inset-top,0px)}
.side-head{padding:20px 18px 16px;border-bottom:1px solid var(--panel-line)}
.who{display:flex;gap:12px;align-items:center;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.who img{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--amber));flex:none}
.who b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.who span{font-size:12.5px;color:var(--amber-soft);display:block}
.outline{flex:1;overflow-y:auto;padding:12px 10px}
.homelink{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;font-weight:700;font-size:14.5px;width:100%;text-align:left}
.homelink:hover{background:var(--tint)}
.homelink.cur{background:rgba(232,163,61,.14);color:var(--amber-soft)}
.mod{margin:2px 0}
.mod-btn{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:12px;cursor:pointer;text-align:left}
.mod-btn:hover{background:var(--tint)}
.mod-ic{width:30px;height:30px;border-radius:9px;background:var(--c);display:grid;place-items:center;font-size:15px;flex:none}
.mod-t{flex:1;font-weight:700;font-size:14.5px;line-height:1.25}
.mod-c{font-size:11.5px;color:var(--muted);font-weight:600}
.chev{width:14px;height:14px;flex:none;transition:transform .2s;color:var(--muted)}
.mod.open .chev{transform:rotate(90deg)}
.pages{list-style:none;padding:2px 0 6px 14px;margin:0 0 0 24px;border-left:1.5px solid var(--panel-line);display:none}
.mod.open .pages{display:block}
.pages button{display:flex;gap:9px;align-items:flex-start;width:100%;padding:6px 10px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;color:var(--muted);font-size:13.5px;line-height:1.35}
.pages button:hover{color:var(--cream);background:var(--tint)}
.pages button.cur{color:var(--amber-soft);background:rgba(232,163,61,.12);font-weight:700}
.tick{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--panel-line);flex:none;margin-top:2px;display:grid;place-items:center}
.seen .tick{background:var(--sage);border-color:var(--sage)}
.seen .tick::after{content:"";width:6px;height:3px;border:1.6px solid var(--navy);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.side-foot{border-top:1px solid var(--panel-line);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
.side-foot .btn-primary{flex:1}

.mhead{display:none}
.scrim{display:none}
@media (max-width:960px){
  .side{transform:translateX(-102%);transition:transform .25s;width:min(86vw,320px)}
  body.nav-open .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(6,5,16,.6);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .mhead{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(20,16,43,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--panel-line);padding:10px 16px;align-items:center;gap:12px}
  .mhead-t{flex:1;min-width:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
.main{margin-left:var(--side);padding-inline:36px;padding-block:0 48px;min-height:100vh}
@media (max-width:960px){.main{margin-left:0;padding-inline:16px}}
.col{max-width:960px;margin:0 auto}
.view{padding-top:40px;animation:enter .35s cubic-bezier(.22,.8,.32,1) both}
@keyframes enter{from{transform:translateY(14px) scale(.99)}to{transform:none}}

/* la hoja de cada página = el panel modal del creativo */
.sheet{background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;padding:34px 34px 32px}
@media (max-width:600px){.sheet{padding:24px 18px}}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.crumb button{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);font-size:13px}
.crumb button:hover{color:var(--amber-soft)}
.phead{display:grid;gap:10px;margin-bottom:26px}
.eyebrow{font-size:13px;font-weight:600;color:var(--c,var(--amber-soft))}
.phead h1{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.015em}
.phead p{color:var(--muted);max-width:62ch;font-size:15.5px}
.pdots{display:flex;gap:6px;align-items:center}
.pdots i{width:24px;height:6px;border-radius:99px;background:rgba(247,236,218,.12)}
.pdots i.on{background:var(--c,var(--amber))}
.pdots span{font-size:12px;color:var(--muted);margin-left:6px;font-weight:600}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.pg{display:grid;gap:2px;padding:14px 22px;border:1.5px solid rgba(247,236,218,.18);border-radius:999px;background:rgba(20,16,43,.6);cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .15s}
.pg:hover{border-color:var(--amber);background:rgba(232,163,61,.14);transform:translateY(-1px)}
.pg small{font-size:12px;color:var(--muted);font-weight:600}
.pg b{font-weight:700;font-size:14.5px;line-height:1.3}
.pg.next{text-align:right;grid-column:2}
.pg.next.primary{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.pg.next.primary small{color:var(--ink);opacity:.75}
.pg.next.primary:hover{background:var(--amber-soft)}
@media (max-width:560px){.pg{border-radius:18px;padding:12px 16px}}

/* ================= INICIO ================= */
.welcome{display:flex;gap:18px;align-items:center;margin-bottom:26px;flex-wrap:wrap}
.welcome img{width:128px;height:128px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--amber));box-shadow:0 10px 24px -8px rgba(232,163,61,.55)}
.welcome div{flex:1;min-width:240px;display:grid;gap:6px}
.welcome h1{font-size:clamp(30px,4.4vw,44px);font-weight:700;letter-spacing:-.02em}
.welcome p{color:var(--muted);max-width:60ch}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:820px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;overflow:hidden;min-height:250px;border-radius:22px;border:0;background:var(--c);color:#1a1433;display:flex;flex-direction:column;justify-content:space-between;gap:16px;text-align:left;padding:22px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s}
.tile:hover,.tile:focus-visible{transform:translateY(-6px);box-shadow:0 18px 36px -12px var(--c)}
.tile-n{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.75;position:relative;z-index:1}
.tile h2{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05;position:relative;z-index:1;max-width:85%}
.tile ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px;font-size:14px;font-weight:600;opacity:.82;position:relative;z-index:1}
.tile-foot{position:relative;z-index:1;display:grid;gap:8px}
.tile-foot .row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700}
.bar{height:6px;border-radius:99px;background:rgba(26,20,51,.18);overflow:hidden}
.bar i{display:block;height:100%;background:#1a1433;border-radius:99px;transition:width .3s}
.tile-icon{position:absolute;right:-16px;top:40px;font-size:130px;line-height:1;transform:rotate(-14deg);opacity:.28;transition:transform .35s cubic-bezier(.2,.8,.3,1),opacity .35s;pointer-events:none}
.tile:hover .tile-icon{transform:rotate(0) scale(1.08);opacity:.5}
.strip{margin-top:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border:1px solid var(--panel-line);border-radius:20px;background:var(--panel);padding:16px 22px}
.strip p{font-size:15.5px}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ================= CONTENIDO ================= */
.prose{display:grid;gap:14px;max-width:68ch}
.prose p{color:var(--cream-2);line-height:1.7}
.lead{font-size:17px}
.hl{color:var(--amber-soft);font-weight:800}
.stack{display:grid;gap:12px}
.gap-l{display:grid;gap:26px}
.label{font-size:13px;font-weight:600;color:var(--amber-soft);margin-bottom:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;background:rgba(247,236,218,.07);border:1px solid var(--panel-line);padding:5px 11px;border-radius:999px;color:rgba(247,236,218,.85)}
.char{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.char img{width:clamp(150px,22vw,200px);height:clamp(150px,22vw,200px);border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--amber));flex:none;box-shadow:0 10px 24px -8px rgba(232,163,61,.55)}
.char-info{flex:1;min-width:220px;display:grid;gap:7px}
.lvl{display:inline-flex;align-items:center;gap:6px;width:max-content;font-size:12.5px;font-weight:700;color:var(--amber-soft);background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.3);padding:5px 12px;border-radius:999px}
.xp-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.xp{height:8px;border-radius:99px;background:rgba(247,236,218,.1);overflow:hidden}
.xp i{display:block;height:100%;width:77.5%;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--amber))}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:rgba(232,163,61,.1);border:1px solid rgba(232,163,61,.3);color:var(--amber-soft);font-size:13px;font-weight:600;padding:6px 12px;border-radius:10px}

/* valores */
.vflip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.vflip-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.vflip-grid{grid-template-columns:1fr}}
.vflip-card{height:160px;perspective:800px;cursor:pointer;outline:none}
.vflip-card:focus-visible .vflip-inner{box-shadow:0 0 0 3px var(--amber);border-radius:14px}
.vflip-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);border-radius:14px}
.vflip-card:hover .vflip-inner,.vflip-card.flipped .vflip-inner{transform:rotateY(180deg)}
.vflip-front,.vflip-back{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;padding:16px 18px;background:rgba(247,236,218,.045);border:1.5px solid color-mix(in srgb,var(--vc) 35%,transparent)}
.vflip-back{transform:rotateY(180deg)}
.vflip-icon{font-size:24px;margin-bottom:7px}
.vflip-title{font-size:16px;font-weight:700;line-height:1.25;margin-bottom:3px;color:var(--vc)}
.vflip-sub{font-size:12.5px;color:var(--muted)}
.vflip-hint{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--amber-soft);margin-top:auto}
.vflip-tag{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;color:var(--vc)}
.vflip-desc{font-size:13.5px;color:rgba(247,236,218,.88);line-height:1.6}

/* línea temporal */
.tl2-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.tl2-legend{display:flex;flex-wrap:wrap;gap:7px}
.tl2-leg-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1.5px solid var(--panel-line);cursor:pointer;background:none;color:rgba(247,236,218,.8);transition:opacity .2s}
.tl2-leg-item.off{opacity:.3}
.tl2-leg-dot{width:8px;height:8px;border-radius:50%;flex:none}
.tl2-all-btn{font-size:12.5px;font-weight:800;padding:8px 16px;border-radius:20px;border:1.5px solid var(--amber);background:transparent;color:var(--amber);cursor:pointer;transition:background .15s,color .15s}
.tl2-all-btn:hover,.tl2-all-btn[aria-expanded="true"]{background:var(--amber);color:var(--ink)}
.tl2-axis{position:relative;height:20px;margin:0 2px 4px}
.tl2-yr{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--faint);font-weight:700}
.tl2-yr.now{color:var(--amber)}
.tl2-body{position:relative;padding-top:4px}
.tl2-rlabel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:rgba(247,236,218,.5);margin-bottom:10px}
.tl2-rail{position:relative;height:12px;border-radius:6px;margin:0 2px;background:rgba(247,236,218,.06)}
.tl2-bars,.tl2-pins{position:absolute;inset:0}
.tl2-bar{position:absolute;top:0;height:100%;border-radius:6px;cursor:pointer;transition:filter .15s,transform .15s;outline:none}
.tl2-bar:hover,.tl2-bar.active,.tl2-bar:focus-visible{filter:brightness(1.15);transform:scaleY(1.8);z-index:3}
.tl2-pin{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;border:2px solid var(--panel);cursor:pointer;transition:transform .15s;outline:none}
.tl2-pin:hover,.tl2-pin.active,.tl2-pin:focus-visible{transform:translate(-50%,-50%) scale(1.6);z-index:3}
.tl2-gap{height:26px}

function ensureCtx(){ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) audioCtx=new AC(); } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); }
function tone(f,d,v,type,off,fEnd){ if(!soundOn||!audioCtx) return; const t0=audioCtx.currentTime+(off||0); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); if(fEnd) o.frequency.exponentialRampToValueAtTime(fEnd,t0+d); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.008); g.gain.exponentialRampToValueAtTime(.0001,t0+d); o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0+d+.02); }
const sound={ hover:()=>tone(720,.10,.035,'sine'), tick:()=>tone(900,.05,.018,'square'), open:()=>{ tone(520,.10,.05,'sine'); tone(780,.13,.04,'sine',.05); }, close:()=>{ tone(600,.09,.04,'sine'); tone(420,.12,.035,'sine',.04); } };

function pager(id){
  if(id==='home') return '';
  const p=byId[id]; const prev=ORDER[p.i-1], next=ORDER[p.i+1];
  const nextSec = next && next.s!==p.s;
  const lbl = n => `${n.s.title} · ${n.t}`;
  return `<div class="pager">
    ${prev?`<button class="pg prev" data-go="${prev.id}"><small>← Anterior</small><b>${lbl(prev)}</b></button>`:`<button class="pg prev" data-go="home"><small>← Volver</small><b>Inicio</b></button>`}

    </div>`;
}

function go(id, push=true){
  if(id==='cover') id='home';
  if(id!=='home' && !byId[id]) id='home';
  current=id; closePopup(true);
  if(push){ try{ history.replaceState(null,'','#'+id); }catch(e){} }
  if(id==='home'){ document.title='Portfolio profesional de Pilar Ramírez'; document.body.classList.remove('in-app'); setNav(false); renderCover(); window.scrollTo(0,0); const h=document.getElementById('cv-h'); h.setAttribute('tabindex','-1'); if(push) h.focus({preventScroll:true}); return; }
  document.body.classList.add('in-app'); setNav(false);
  markSeen(id);
  view.innerHTML = id==='home' ? `<div class="view">${R.home()}</div>` : `<div class="view"><div class="sheet">${R[id](byId[id])}</div>${pager(id)}</div>`; sound.open();
  renderOutline(id);
  const ptitle = id==='home' ? 'Inicio' : byId[id].t;
  document.title = ptitle+' · Pilar Ramírez';
  document.getElementById('announcer').textContent = ptitle;
  { const p=byId[id], prev=ORDER[p.i-1], next=ORDER[p.i+1], k=p.s.pages.findIndex(x=>x.id===id);
    const mp=document.getElementById('mPrev'), mn=document.getElementById('mNext');
    mp.dataset.go = prev ? prev.id : 'home'; mp.innerHTML = lu('arrow-left',18); mp.setAttribute('aria-label', prev ? 'Anterior: '+prev.t : 'Volver al inicio');
    mn.dataset.go = next ? next.id : 'home'; mn.innerHTML = `<span>${next ? (next.s!==p.s ? next.s.title : next.t) : 'Volver al inicio'}</span>${lu(next?'arrow-right':'house',18)}`; mn.setAttribute('aria-label', next ? 'Siguiente: '+next.t : 'Volver al inicio');
    document.getElementById('mPos').textContent = `${k+1}/${p.s.pages.length}`; }
  document.getElementById('mTitle').textContent = id==='home' ? 'Inicio' : `${byId[id].s.title} · ${byId[id].t}`;
  window.scrollTo({top:0});
  wire(id);
  const h=view.querySelector('h1'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(!b) return; e.preventDefault(); go(b.dataset.go); });
document.addEventListener('keydown',e=>{
  if(!lb.hidden || popupBd.classList.contains('open')) return;
  if(e.target.closest('input,textarea,select,.vflip-card,.tl2-bar,.tl2-pin,.tl2-leg-item')) return;
  
  const order=['home',...ORDER.map(p=>p.id)]; const i=order.indexOf(current);
  if(e.key==='ArrowRight' && i<order.length-1) go(order[i+1]);

});

function initTimeline(){

  barsEl.innerHTML = EXP.map(it=>`<div class="tl2-bar" data-id="${it.id}" data-cat="${it.cat}" style="left:${pct2(it.s)};width:${((it.e-it.s)/R_Y*100).toFixed(3)}%;background:${CATS2[it.cat].color}" tabindex="0" role="button" aria-label="${it.title}, ${it.org}, ${it.date}"></div>`).join('');
  pinsEl.innerHTML = EDU.map(it=>`<div class="tl2-pin" data-id="${it.id}" data-cat="${it.cat}" style="left:${pct2(it.y)};background:${CATS2[it.cat].color}" tabindex="0" role="button" aria-label="${it.title}, ${it.org}, ${it.date}"></div>`).join('');
  let activeId=null;
  function show(item,el,isExp){
    view.querySelectorAll('.tl2-bar.active,.tl2-pin.active').forEach(e=>e.classList.remove('active'));
    if(activeId===item.id){ activeId=null; detailEl.classList.remove('show'); el.setAttribute('aria-expanded','false'); return; }
    activeId=item.id; el.classList.add('active'); view.querySelectorAll('.tl2-bar,.tl2-pin').forEach(x=>x.setAttribute('aria-expanded',x===el));
    if(!allEl.hidden){ allEl.hidden=true; allBtn.setAttribute('aria-expanded','false'); allBtn.innerHTML=lu('list',15)+' Ver todo'; }
    const c=CATS2[item.cat];
    const prefix = isExp ? 'Experiencia' : item.reg==='reglada' ? 'Formación reglada' : item.reg==='especializada' ? 'Formación especializada' : 'Formación no reglada';
    detailIn.innerHTML = `<span class="tl2-d-badge" style="background:color-mix(in srgb,${c.color} 15%,transparent);color:${c.color}">${prefix} · ${c.label}</span><div class="tl2-d-title">${item.title}</div><div class="tl2-d-org" style="color:${c.color}">${item.org}</div><div class="tl2-d-date">${item.date}</div>${item.code?`<div class="tl2-d-code">${lu('tag',13)} ${item.code}</div>`:''}<ul class="tl2-d-list">${item.items.map(t=>`<li>${t}</li>`).join('')}</ul>`;
    detailEl.classList.add('show');
  }
  const bind=(el,item,isExp)=>{ el.addEventListener('click',()=>show(item,el,isExp)); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); show(item,el,isExp); } }); };
  barsEl.querySelectorAll('.tl2-bar').forEach(b=>bind(b,EXP.find(i=>i.id===b.dataset.id),true));
  pinsEl.querySelectorAll('.tl2-pin').forEach(p=>bind(p,EDU.find(i=>i.id===p.dataset.id),false));
  // abre por defecto el puesto actual
  const nowBar=barsEl.querySelector('[data-id="e3"]'); if(!window.matchMedia('(max-width:600px)').matches) show(EXP.find(i=>i.id==='e3'),nowBar,true);
  const entry=(it,isExp)=>`<div class="tl2-entry" data-cat="${it.cat}" style="--c:${CATS2[it.cat].color}"><div class="tl2-entry-t">${it.title}</div><div class="tl2-entry-o">${it.org}</div><div class="tl2-entry-d">${it.date}</div>${it.code?`<div class="tl2-entry-d">${lu('tag',12)} ${it.code}</div>`:''}<details><summary>${isExp?'Ver funciones':'Ver contenidos'}</summary><ul class="tl2-d-list">${it.items.map(t=>`<li>${t}</li>`).join('')}</ul></details></div>`;
  allEl.innerHTML = `<div class="tl2-col"><h3 class="tl2-col-h">${lu('briefcase',14)} Experiencia profesional</h3>${[...EXP].sort((a,b)=>b.s-a.s).map(it=>entry(it,true)).join('')}</div><div class="tl2-col"><h3 class="tl2-col-h">${lu('graduation-cap',14)} Formación</h3>${[...EDU].sort((a,b)=>b.y-a.y).map(it=>entry(it,false)).join('')}</div>`;
  if(window.matchMedia('(max-width:600px)').matches){ allEl.hidden=false; allBtn.setAttribute('aria-expanded','true'); allBtn.innerHTML=lu('x',15)+' Ocultar lista'; }
  allBtn.addEventListener('click',()=>{ const open=allEl.hidden; allEl.hidden=!open; allBtn.setAttribute('aria-expanded',open); allBtn.innerHTML=open?lu('x',15)+' Ocultar lista':lu('list',15)+' Ver todo';
    if(open){ activeId=null; detailEl.classList.remove('show'); view.querySelectorAll('.tl2-bar.active,.tl2-pin.active').forEach(e=>e.classList.remove('active')); } });
  const active=new Set(Object.keys(CATS2));
  const apply=()=>{ allEl.querySelectorAll('.tl2-entry').forEach(e=>e.hidden=!active.has(e.dataset.cat));
    view.querySelectorAll('.tl2-bar,.tl2-pin').forEach(b=>{ const on=active.has(b.dataset.cat); b.style.opacity=on?'1':'.15'; b.style.pointerEvents=on?'auto':'none'; b.tabIndex=on?0:-1; }); };
  legEl.querySelectorAll('.tl2-leg-item').forEach(it=>it.addEventListener('click',()=>{ const k=it.dataset.cat; if(active.has(k)){ if(active.size>1) active.delete(k); } else active.add(k); it.classList.toggle('off',!active.has(k)); it.setAttribute('aria-pressed',active.has(k)); apply(); }));
}

function initSkills(){
  const grid=document.getElementById('compGrid'), empty=document.getElementById('compEmpty');
  let cat='all', q='';
  const apply=()=>{ let n=0; grid.querySelectorAll('.comp-pill').forEach(p=>{ const show=(cat==='all'||p.dataset.cat===cat)&&(!q||p.dataset.name.includes(q)); p.hidden=!show; if(show) n++; }); empty.hidden=!!n; };
  document.getElementById('compSearch').addEventListener('input',e=>{ q=e.target.value.toLowerCase().trim(); apply(); });
  view.querySelectorAll('.comp-chip').forEach(c=>c.addEventListener('click',()=>{ view.querySelectorAll('.comp-chip').forEach(x=>x.setAttribute('aria-pressed',x===c)); cat=c.dataset.cat; apply(); }));
  grid.querySelectorAll('.comp-pill').forEach(p=>p.addEventListener('click',()=>{ const g=SKILL_GROUPS.find(g=>g.label===p.dataset.cat); const s=g.skills.find(s=>skillName(s).toLowerCase()===p.dataset.name); openPopup(g,s,p); }));
}

/* popup de herramienta */
const popupBd=document.createElement('div'); popupBd.className='popup-bd';
popupBd.innerHTML=`<div class="popup" role="dialog" aria-modal="true" aria-labelledby="popT"><button class="popup-x" id="popX" aria-label="Cerrar">✕</button><div class="popup-ic" id="popIc"></div><div class="popup-badge" id="popB"></div><div class="popup-t" id="popT"></div><div class="stars" id="popS"></div><div class="popup-lvl" id="popL"></div><div class="popup-d" id="popD"></div></div>`;
document.body.appendChild(popupBd);
let popTrig=null;
function openPopup(g,s,trig){
  popTrig=trig;
  document.getElementById('popIc').innerHTML=lu(g.icon,30,1.8); document.getElementById('popIc').style.color=g.color;
  const b=document.getElementById('popB'); b.textContent=g.label; b.style.color=g.color; b.style.background=`color-mix(in srgb,${g.color} 15%,transparent)`;
  document.getElementById('popT').textContent=skillName(s);
  document.getElementById('popL').textContent=`${LVL_LABEL[s.lvl]} · ${s.lvl}/5`;
  document.getElementById('popD').textContent=s.d;
  const st=document.getElementById('popS'); st.innerHTML='★★★★★'.split('').map(()=>'<span>★</span>').join('');
  popupBd.classList.add('open'); document.getElementById('popX').focus();
  st.querySelectorAll('span').forEach((x,i)=>setTimeout(()=>{ x.style.opacity=1; x.style.transform='scale(1)'; if(i<s.lvl) x.classList.add('on'); },120+i*70));
}
function closePopup(silent){ if(!popupBd.classList.contains('open')) return; if(!silent) sound.close(); popupBd.classList.remove('open'); if(!silent&&popTrig) popTrig.focus(); }
document.getElementById('popX').addEventListener('click',()=>closePopup());
popupBd.addEventListener('click',e=>{ if(e.target===popupBd) closePopup(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&popupBd.classList.contains('open')) closePopup(); });

/* contacto: Web3Forms */
const WEB3FORMS_ACCESS_KEY="9a5b40bb-db5c-4fb0-bb1a-80cf468d9ea8";
function wireForm(){
  const f=document.getElementById('cform'), st=document.getElementById('f-status'), send=document.getElementById('f-send');
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const bad=[...f.querySelectorAll('[required]')].find(x=>!x.value.trim()||(x.type==='email'&&!/^\S+@\S+\.\S+$/.test(x.value)));
    f.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));
    if(bad){ bad.setAttribute('aria-invalid','true'); st.textContent = bad.type==='email'?'Revisa el email: parece que le falta algo.':'Completa nombre, email y mensaje para poder enviarlo.'; bad.focus(); return; }
    send.disabled=true; send.textContent='Enviando…'; st.textContent='Enviando tu mensaje…';
    const d=new FormData(f); d.append('access_key',WEB3FORMS_ACCESS_KEY); d.append('subject',`Nuevo mensaje desde el portfolio profesional — ${d.get('motivo')}${d.get('empresa')?' · '+d.get('empresa'):''}`); d.append('from_name','Portfolio profesional de Pilar Ramírez');
    try{ const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{Accept:'application/json'},body:d}); const j=await r.json();
      st.textContent = j.success ? 'Mensaje enviado. Te responderé en cuanto lo lea.' : 'No se ha podido enviar. Inténtalo de nuevo en unos minutos o escríbeme por LinkedIn.'; if(j.success) f.reset();
    }catch(err){ st.textContent='No se ha podido enviar desde esta vista. Escríbeme por LinkedIn mientras tanto.'; }
    finally{ send.disabled=false; send.textContent='Enviar mensaje'; }
  });
}

/* visor de capturas con zoom */
const lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg'); let set=[], li=0, trig=null, z={s:1,x:0,y:0};
const applyZ=()=>{ lbImg.style.transform=`translate(${z.x}px,${z.y}px) scale(${z.s})`; lbImg.classList.toggle('z',z.s>1); document.getElementById('zReset').textContent=Math.round(z.s*100)+'%'; };
const setZ=s=>{ z.s=Math.min(4,Math.max(1,s)); if(z.s===1){z.x=0;z.y=0;} applyZ(); };
const show=()=>{ lbImg.src=IMG(set[li][0]); lbImg.alt=set[li][1]; document.getElementById('lbCap').textContent=set[li][1]; document.getElementById('lbCount').textContent=`${li+1} / ${set.length}`; z={s:1,x:0,y:0}; applyZ(); };
document.addEventListener('click',e=>{ const t=e.target.closest('[data-case]'); if(!t) return; trig=t; set=PROJECTS[t.dataset.case].images; li=+t.dataset.k; show(); lb.hidden=false; document.getElementById('lbClose').focus(); });
const closeLb=()=>{ sound.close(); lb.hidden=true; if(trig) trig.focus(); };
document.getElementById('lbClose').addEventListener('click',closeLb);
document.getElementById('lbPrev').addEventListener('click',()=>{ li=(li-1+set.length)%set.length; show(); });
document.getElementById('lbNext').addEventListener('click',()=>{ li=(li+1)%set.length; show(); });
document.getElementById('zIn').addEventListener('click',()=>setZ(z.s+.5));
document.getElementById('zOut').addEventListener('click',()=>setZ(z.s-.5));
document.getElementById('zReset').addEventListener('click',()=>setZ(1));
lbImg.addEventListener('dblclick',()=>setZ(z.s>1?1:2.5));
lb.querySelector('.lb-stage').addEventListener('wheel',e=>{ e.preventDefault(); setZ(z.s+(e.deltaY<0?.25:-.25)); },{passive:false});
let drag=null;
lbImg.addEventListener('pointerdown',e=>{ if(z.s<=1) return; e.preventDefault(); drag={px:e.clientX,py:e.clientY,x:z.x,y:z.y}; lbImg.setPointerCapture(e.pointerId); });
lbImg.addEventListener('pointermove',e=>{ if(!drag) return; z.x=drag.x+e.clientX-drag.px; z.y=drag.y+e.clientY-drag.py; applyZ(); });
['pointerup','pointercancel'].forEach(t=>lbImg.addEventListener(t,()=>drag=null));
let tx=null;
lb.querySelector('.lb-stage').addEventListener('touchstart',e=>{ if(z.s===1&&e.touches.length===1) tx=e.touches[0].clientX; },{passive:true});
lb.querySelector('.lb-stage').addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>50) document.getElementById(dx<0?'lbNext':'lbPrev').click(); });
lb.addEventListener('click',e=>{ if(e.target===lb||(e.target.classList.contains('lb-stage')&&z.s===1)) closeLb(); });
document.addEventListener('keydown',e=>{ if(lb.hidden) return; if(e.key==='Escape') closeLb(); if(e.key==='ArrowRight') document.getElementById('lbNext').click(); if(e.key==='ArrowLeft') document.getElementById('lbPrev').click(); if(e.key==='+'||e.key==='=') setZ(z.s+.5); if(e.key==='-') setZ(z.s-.5); });


document.documentElement.lang='es';
function trapTab(e,box){ if(e.key!=='Tab') return; const f=[...box.querySelectorAll('button:not([disabled]),a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null); if(!f.length) return; const a=f[0], z=f[f.length-1]; if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); z.focus(); } else if(!e.shiftKey&&document.activeElement===z){ e.preventDefault(); a.focus(); } }
document.addEventListener('keydown',e=>{ if(!lb.hidden) trapTab(e,lb); else if(popupBd.classList.contains('open')) trapTab(e,popupBd); else if(document.body.classList.contains('nav-open')) trapTab(e,document.getElementById('side')); });
document.getElementById('skipLink').addEventListener('click',e=>{ e.preventDefault(); const h=view.querySelector('h1'); (h||view).focus(); });

/* inicio */
const start=(location.hash||'').slice(1);
go(start && byId[start] ? start : 'home', false);
</script>
